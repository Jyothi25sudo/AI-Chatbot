<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chatbot-container">
        <!-- Header -->
        <header class="chatbot-header">
            <div class="header-content">
                <div class="bot-icon">🤖</div>
                <div class="header-text">
                    <h1>ChatBot</h1>
                    <p>Your AI Assistant</p>
                </div>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <main class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <p>Hello! I'm ChatBot. Welcome! 👋</p>
                    <p>I can chat with you, answer questions about myself, and have a friendly conversation.</p>
                    <p>Type 'help' to see what I can do, or just say hello!</p>
                </div>
                <span class="message-time">Now</span>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-area">
            <div class="input-container">
                <input 
                    type="text" 
                    id="userInput" 
                    class="message-input" 
                    placeholder="Type your message here..."
                    autocomplete="off"
                >
                <button id="sendButton" class="send-button" title="Send message (Enter)">
                    <span>Send</span>
                    <span class="send-icon">➤</span>
                </button>
            </div>
            <div class="button-group">
                <button id="clearButton" class="clear-button">Clear Chat</button>
            </div>
        </footer>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
